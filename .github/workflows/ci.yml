name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      STYLUA_VERSION: v2.6.0
      LUALS_VERSION: 3.19.2
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          luarocks --local --lua-version=5.1 install luacheck 1.2.0
          luarocks --local --lua-version=5.1 install busted 2.3.0

      - name: Install StyLua and LuaLS
        run: |
          mkdir -p ~/.local/bin ~/.local/opt/lua-language-server
          curl -sSL -o /tmp/stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -q /tmp/stylua.zip -d ~/.local/bin && chmod +x ~/.local/bin/stylua
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar xz -C ~/.local/opt/lua-language-server
          ln -sf ~/.local/opt/lua-language-server/bin/lua-language-server ~/.local/bin/lua-language-server

      - run: make lint
      - run: make fmt-check
      - run: make types
      - run: make test
